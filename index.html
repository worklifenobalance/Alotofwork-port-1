<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #e9edf2;
            font-family: Arial, "Noto Sans Thai", sans-serif;
            color: #222;
        }

        /* =========================
           TOP BAR
        ========================= */

        .top-bar {
            position: sticky;
            top: 0;
            z-index: 1000;

            width: 100%;
            background: rgba(10, 15, 25, 0.96);
            backdrop-filter: blur(10px);

            padding: 14px 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.25);
        }

        .brand {
            color: white;
        }

        .brand h1 {
            font-size: 20px;
            font-weight: 700;
        }

        .brand p {
            font-size: 12px;
            color: #cbd5e1;
            margin-top: 3px;
        }

        .view-button {
            text-decoration: none;
            color: white;
            background: #2563eb;

            padding: 9px 16px;
            border-radius: 8px;

            font-size: 13px;
            font-weight: 600;

            transition: 0.2s;
        }

        .view-button:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        /* =========================
           PORTFOLIO CONTAINER
        ========================= */

        .portfolio-container {
            width: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 35px 15px 50px;
            gap: 30px;
        }

        /* =========================
           EACH PORTFOLIO PAGE
        ========================= */

        .portfolio-page {
            width: min(794px, 92vw);

            background: white;

            position: relative;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.18);

            border-radius: 2px;

            overflow: visible;
        }

        /* =========================
           PORTFOLIO IMAGE
        ========================= */

        .portfolio-page img {
            display: block;

            width: 100%;
            height: auto;

            max-width: 100%;

            object-fit: contain;
            object-position: center;

            background: white;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            text-align: center;

            padding: 25px 15px 35px;

            color: #64748b;
            font-size: 13px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .top-bar {
                padding: 12px 14px;
            }

            .brand h1 {
                font-size: 17px;
            }

            .brand p {
                font-size: 10px;
            }

            .view-button {
                padding: 8px 12px;
                font-size: 11px;
            }

            .portfolio-container {
                padding: 20px 5px 35px;
                gap: 20px;
            }

            .portfolio-page {
                width: 96vw;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         TOP BAR
    ========================= -->

    <header class="top-bar">

        <div class="brand">
            <h1>My Portfolio</h1>
            <p>Computer Science • University Admission Portfolio</p>
        </div>

        <a href="#portfolio" class="view-button">
            ดู Portfolio
        </a>

    </header>
