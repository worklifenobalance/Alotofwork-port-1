<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #e9edf2;
            font-family: Arial, "Noto Sans Thai", sans-serif;
        }

        /* =========================
           PORTFOLIO
        ========================= */

        .portfolio-container {
            width: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 25px;

            padding: 15px 0 30px;
        }

        /* =========================
           A4 PAGE
        ========================= */

        .portfolio-page {
            /*
                FHD 1920x1080
                เผื่อพื้นที่เล็กน้อยสำหรับ browser
                ทำให้ 1 หน้าเห็นครบในจอ
            */

            height: calc(100vh - 35px);

            width: auto;

            aspect-ratio: 210 / 297;

            background: white;

            flex-shrink: 0;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.18);
        }

        /* =========================
           IMAGE
        ========================= */

        .portfolio-page img {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;

            object-position: center;
        }

        /* =========================
           SMALL SCREEN
        ========================= */

        @media (max-width: 800px) {

            .portfolio-container {
                padding: 10px 0 25px;
                gap: 15px;
            }

            .portfolio-page {
                width: 96vw;
                height: auto;

                aspect-ratio: 210 / 297;
            }

            .portfolio-page img {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>

<body>

    <main class="portfolio-container">

        <section class="portfolio-page">
            <img src="portfolio/1.png" alt="Portfolio Page 1">
        </section>

        <section class="portfolio-page">
            <img src="portfolio/2.png" alt="Portfolio Page 2">
        </section>

        <section class="portfolio-page">
            <img src="portfolio/3.png" alt="Portfolio Page 3">
        </section>

        <section class="portfolio-page">
            <img src="portfolio/4.png" alt="Portfolio Page 4">
        </section>

        <section class="portfolio-page">
            <img src="portfolio/5.png" alt="Portfolio Page 5">
        </section>

        <section class="portfolio-page">
            <img src="portfolio/6.png" alt="Portfolio Page 6">
        </section>

        <section class="portfolio-page">
            <img src="portfolio/7.png" alt="Portfolio Page 7">
        </section>

        <section class="portfolio-page">
            <img src="portfolio/8.png" alt="Portfolio Page 8">
        </section>

        <section class="portfolio-page">
            <img src="portfolio/9.png" alt="Portfolio Page 9">
        </section>

        <section class="portfolio-page">
            <img src="portfolio/10.png" alt="Portfolio Page 10">
        </section>

        <section class="portfolio-page">
            <img src="portfolio/11.png" alt="Portfolio Page 11">
        </section>

        <section class="portfolio-page">
            <img src="portfolio/12.png" alt="Portfolio Page 12">
        </section>

        <section class="portfolio-page">
            <img src="portfolio/13.png" alt="Portfolio Page 13">
        </section>

    </main>

</body>
</html>
