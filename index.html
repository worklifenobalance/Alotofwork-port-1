<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Website</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 600px;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #1677ff;
            margin-bottom: 10px;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        button {
            background: #1677ff;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background: #0056d6;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #00a86b;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🚀 สวัสดีจาก GitHub Pages</h1>

        <p>
            เว็บไซต์นี้กำลังทำงานด้วย HTML + CSS + JavaScript
        </p>

        <button onclick="testButton()">
            กดทดสอบ
        </button>

        <div id="result"></div>
    </div>

    <script>
        function testButton() {
            document.getElementById("result").innerHTML =
                "✅ JavaScript ทำงานแล้ว!";
        }
    </script>

</body>
</html>
