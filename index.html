<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #222;
            font-family: Arial, sans-serif;
        }

        .topbar {
            width: 100%;
            height: 60px;
            background: #111;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
        }

        .open-btn {
            color: white;
            background: #2563eb;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
        }

        .open-btn:hover {
            background: #1d4ed8;
        }

        .portfolio {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        iframe {
            width: 100%;
            height: calc(100vh - 100px);
            min-height: 700px;
            border: none;
            background: white;
            border-radius: 8px;
        }

        @media (max-width: 768px) {

            .topbar {
                height: 55px;
                padding: 0 12px;
            }

            .title {
                font-size: 16px;
            }

            .open-btn {
                padding: 8px 12px;
                font-size: 12px;
            }

            .portfolio {
                padding: 8px;
            }

            iframe {
                height: calc(100vh - 70px);
                min-height: 600px;
                border-radius: 4px;
            }
        }
    </style>
</head>

<body>

    <div class="topbar">

        <div class="title">
            My Portfolio
        </div>

        <a
            class="open-btn"
            href="portfolio.pdf"
            target="_blank">
            เปิด Portfolio เต็มจอ
        </a>

    </div>


    <div class="portfolio">

        <iframe
            src="portfolio.pdf"
            title="My Portfolio">
        </iframe>

    </div>

</body>
</html>
